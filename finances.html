<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Manager | FarmPath</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"></head><body class="app-page"><aside class="sidebar"><a class="brand" href="dashboard.html"><b>🌾 Farm<span>Path</span></b></a><div class="side-label">FARMER WORKSPACE</div><a class="side" href="dashboard.html">⌂ <span>Today</span></a><a class="side" href="farms.html">🌾 <span>My Farms</span></a><a class="side" href="calendar.html">📅 <span>Farm Calendar</span></a><a class="side" href="crop-doctor.html">📷 <span>Crop Doctor</span></a><a class="side active" href="finances.html">💰 <span>Money Manager</span></a><div class="side-bottom"><button id="logoutBtn">↪ Log out</button></div></aside><main class="app-main"><header class="app-header"><button class="mobile-menu" id="menuBtn">☰</button><div><p>FARM FINANCES</p><h1>Money Manager</h1></div></header><div class="money-grid"><div><small>TOTAL SPENT</small><h2 id="totalSpent">₦0</h2></div><div><small>EXPECTED REVENUE</small><input id="expectedRevenue" type="number" placeholder="0"></div><div><small>ESTIMATED PROFIT</small><h2 id="profit">₦0</h2></div></div><section class="form-panel"><h2>Add an Expense</h2><form id="expenseForm" class="expense-form"><input id="expenseItem" required placeholder="What did you pay for?"><select id="expenseCategory"><option>Seeds</option><option>Fertilizer</option><option>Pesticides</option><option>Labour</option><option>Tractor</option><option>Fuel</option><option>Irrigation</option><option>Transportation</option><option>Other</option></select><input id="expenseAmount" type="number" required min="1" placeholder="Amount (
