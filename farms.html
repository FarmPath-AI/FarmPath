<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Farms | FarmPath</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"></head><body class="app-page">
<aside class="sidebar"><a class="brand" href="dashboard.html"><b>🌾 Farm<span>Path</span></b></a><div class="side-label">FARMER WORKSPACE</div><a class="side" href="dashboard.html">⌂ <span>Today</span></a><a class="side active" href="farms.html">🌾 <span>My Farms</span></a><a class="side" href="calendar.html">📅 <span>Farm Calendar</span></a><a class="side" href="crop-doctor.html">📷 <span>Crop Doctor</span></a><a class="side" href="finances.html">💰 <span>Money Manager</span></a><div class="side-bottom"><button id="logoutBtn">↪ Log out</button></div></aside>
<main class="app-main"><header class="app-header"><button class="mobile-menu" id="menuBtn">☰</button><div><p>FARM SETUP</p><h1>My Farms</h1></div></header>
<div class="page-intro"><h2>Tell FarmPath about your farm</h2><p>This information helps organize your calendar and personalized workspace.</p></div>
<section class="form-panel"><form id="farmForm" class="farm-form"><label>Farm name<input id="farmNameInput" required placeholder="e.g. Main Maize Farm"></label><label>State<select id="state" required><option value="">Select state</option><option>Kaduna</option><option>Kano</option><option>Katsina</option><option>Sokoto</option><option>Kebbi</option><option>Jigawa</option><option>Borno</option><option>Bauchi</option><option>Niger</option><option>Plateau</option></select></label><label>LGA<input id="lga" required placeholder="Your Local Government Area"></label><label>Community<input id="community" placeholder="Community / village"></label><label>Crop<select id="crop" required><option value="">Select crop</option><option>Maize</option><option>Rice</option><option>Tomato</option><option>Millet</option><option>Sorghum</option><option>Cowpea</option><option>Groundnut</option><option>Onion</option><option>Pepper</option></select></label><label>Farm size (hectares)<input id="farmSize" required type="number" min="0.1" step="0.1" placeholder="e.g. 2"></label><label>Planting date<input id="plantingDate" required type="date"></label><label>Farming system<select id="farmingSystem"><option value="Rain-fed">Rain-fed</option><option value="Irrigated">Irrigated</option></select></label><label class="wide">Soil information<textarea id="soilInfo" placeholder="Optional: pH, soil test results, texture or anything you know"></textarea></label><button class="btn btn-dark" type="submit">Save Farm & Build My Path →</button></form></section>
<section><div class="section-row"><h2>Saved Farms</h2></div><div id="farmList" class="saved-list"></div></section></main><script src="app.js"></script><script src="farms.js"></script></body></html>
